name: PhotoStudio Android Debug APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0"

      - name: Use only Firebase configuration from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GitHub Secret GOOGLE_SERVICES_JSON_BASE64 is empty or unavailable."
            exit 1
          fi

          # Remove any Firebase JSON configuration checked into or generated in the workspace.
          find app -name "google-services.json" -type f -delete

          # Decode the single source of truth: GitHub Secret.
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          config = json.loads(Path("app/google-services.json").read_text())
          expected = "com.winsmediatama.photostudio"
          clients = config.get("client", [])
          packages = [
              client.get("client_info", {}).get("android_client_info", {}).get("package_name")
              for client in clients
          ]
          print("Firebase client package names:", packages)
          if expected not in packages:
              raise SystemExit(f"ERROR: Secret Firebase JSON does not contain client package {expected}")
          print("Firebase secret validated for", expected)
          PY

      - name: Build Debug APK with Firebase Secret
        run: gradle --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
