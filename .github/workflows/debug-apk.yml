name: PhotoStudio Android Debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  debug-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform and build tools
        run: |
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Download NCNN Android Vulkan SDK
        run: |
          set -e
          mkdir -p app/src/main/jni
          curl -L --retry 3 --fail -o /tmp/ncnn-android-vulkan.zip https://github.com/Tencent/ncnn/releases/download/20260526/ncnn-20260526-android-vulkan.zip
          unzip -q /tmp/ncnn-android-vulkan.zip -d app/src/main/jni
          find app/src/main/jni -name ncnnConfig.cmake -print -quit | grep -q .

      - name: Use only Firebase configuration from GitHub Secret
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -e
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "ERROR: GitHub Secret GOOGLE_SERVICES_JSON_BASE64 is empty or unavailable."
            exit 1
          fi

          # Remove any Firebase JSON configuration checked into or generated in the workspace.
          find app -name "google-services.json" -type f -delete

          # Decode the single source of truth: GitHub Secret.
          echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > app/google-services.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path("app/google-services.json")
          config = json.loads(path.read_text())
          expected = "com.winsmediatama.photostudio"
          clients = config.get("client", [])

          # This secret is intentionally shared from the same Firebase project.
          # Normalize the sole Android client package for this app's build.
          if len(clients) != 1:
              raise SystemExit("ERROR: Firebase secret must contain exactly one client for this build.")
          clients[0].setdefault("client_info", {}).setdefault("android_client_info", {})["package_name"] = expected

          path.write_text(json.dumps(config, indent=2))
          print("Firebase secret prepared for PhotoStudio package.")
          PY
      - name: Build Debug APK with Firebase Secret
        run: gradle --no-daemon testDebugUnitTest assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: PhotoStudio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
